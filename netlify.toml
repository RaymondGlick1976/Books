[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Headers for cache control
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirects for SPA-like behavior within portal/admin sections
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Booking forms
[[redirects]]
  from = "/book/*"
  to = "/book.html"
  status = 200

# Online scheduling
[[redirects]]
  from = "/schedule"
  to = "/schedule.html"
  status = 200

[[redirects]]
  from = "/schedule/*"
  to = "/schedule.html"
  status = 200

# CORS headers for API functions (cross-origin embeds)
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[functions."schedule-reminders"]
  schedule = "@hourly"

# Environment variables (set these in Netlify dashboard)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# STRIPE_SECRET_KEY
# STRIPE_PUBLISHABLE_KEY
# STRIPE_WEBHOOK_SECRET
# RESEND_API_KEY
# ADMIN_EMAIL
# SITE_URL
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
