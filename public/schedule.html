<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule an Appointment | Homestead Cabinet Design</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; text-align: center; }
    .logo { max-height: 50px; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 40px; margin-top: -40px; position: relative; }

    /* Step indicator */
    .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #eee; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: default; opacity: 0.35; transition: opacity 0.2s; }
    .step.active, .step.completed { opacity: 1; }
    .step-num {
      width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 600; background: #e5e7eb; color: #6b7280; transition: all 0.2s;
    }
    .step.active .step-num { background: #6366f1; color: white; }
    .step.completed .step-num { background: #10b981; color: white; }
    .step-label { font-size: 0.7rem; font-weight: 500; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
    .step.active .step-label { color: #6366f1; font-weight: 600; }
    .step.completed .step-label { color: #10b981; }

    /* Section title */
    .section-title { font-size: 1.5rem; font-weight: 600; color: #111827; text-align: center; margin-bottom: 24px; }
    .section-subtitle { font-size: 0.95rem; color: #6b7280; text-align: center; margin-top: -16px; margin-bottom: 24px; }

    /* Type cards grid */
    .type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .type-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      padding: 28px 16px; border: 2px solid #e5e7eb; border-radius: 12px; cursor: pointer;
      transition: all 0.2s; background: white; text-align: center;
    }
    .type-card:hover { border-color: #6366f1; box-shadow: 0 2px 12px rgba(99,102,241,0.15); transform: translateY(-2px); }
    .type-card.selected { border-color: #6366f1; background: #eef2ff; box-shadow: 0 2px 12px rgba(99,102,241,0.2); }
    .type-card-icon { font-size: 2.2rem; line-height: 1; }
    .type-card-name { font-size: 0.95rem; font-weight: 500; color: #374151; }

    /* Calendar */
    .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .calendar-nav-btn {
      width: 36px; height: 36px; border: 1px solid #e5e7eb; border-radius: 8px; background: white;
      cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
      color: #374151; transition: all 0.15s;
    }
    .calendar-nav-btn:hover:not(:disabled) { border-color: #6366f1; color: #6366f1; background: #eef2ff; }
    .calendar-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .calendar-month { font-size: 1.1rem; font-weight: 600; color: #111827; }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 4px; }
    .calendar-weekday { font-size: 0.75rem; font-weight: 600; color: #9ca3af; padding: 8px 0; text-transform: uppercase; }
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: all 0.15s;
      border: 1px solid transparent; color: #374151; font-weight: 500;
    }
    .calendar-day:hover:not(.disabled):not(.empty) { background: #eef2ff; border-color: #6366f1; }
    .calendar-day.selected { background: #6366f1; color: white; border-color: #6366f1; }
    .calendar-day.today:not(.selected) { border-color: #6366f1; color: #6366f1; }
    .calendar-day.disabled { color: #d1d5db; cursor: not-allowed; text-decoration: line-through; }
    .calendar-day.empty { cursor: default; }

    /* Time slots */
    .time-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .time-slot {
      padding: 12px 20px; border: 2px solid #e5e7eb; border-radius: 10px; cursor: pointer;
      font-size: 0.95rem; font-weight: 500; color: #374151; background: white; transition: all 0.15s;
      min-width: 110px; text-align: center;
    }
    .time-slot:hover { border-color: #6366f1; background: #eef2ff; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(99,102,241,0.12); }
    .time-slot.selected { border-color: #6366f1; background: #6366f1; color: white; }
    .no-slots { text-align: center; padding: 40px 20px; color: #6b7280; }
    .no-slots p { margin-bottom: 16px; font-size: 1rem; }

    /* Summary line */
    .summary-line {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
      background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 20px; margin-bottom: 28px;
      font-size: 0.9rem; color: #374151;
    }
    .summary-line .sep { color: #d1d5db; }

    /* Form styles (matching book.html) */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 500; color: #333; margin-bottom: 6px; }
    .form-label .required { color: #e53e3e; }
    .form-input, .form-textarea {
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 1rem; transition: border-color 0.2s; font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .form-textarea { min-height: 90px; resize: vertical; }

    /* Buttons */
    .btn-primary {
      width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; color: white;
      background: #6366f1; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; transform: none; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
      border: 1px solid #e5e7eb; border-radius: 8px; background: white; cursor: pointer;
      font-size: 0.875rem; color: #6b7280; transition: all 0.15s; margin-bottom: 20px;
    }
    .btn-back:hover { border-color: #6366f1; color: #6366f1; background: #eef2ff; }
    .btn-link {
      display: inline-block; padding: 12px 28px; font-size: 1rem; font-weight: 500; color: #6366f1;
      background: #eef2ff; border: 2px solid #6366f1; border-radius: 8px; cursor: pointer;
      transition: all 0.2s; text-decoration: none; margin-top: 16px;
    }
    .btn-link:hover { background: #6366f1; color: white; }

    /* Confirmation */
    .confirmation { text-align: center; padding: 40px 0; }
    .confirmation-icon {
      width: 72px; height: 72px; border-radius: 50%; background: #ecfdf5; border: 3px solid #10b981;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
      font-size: 2rem; color: #10b981;
    }
    .confirmation h2 { font-size: 1.75rem; font-weight: 600; color: #111827; margin-bottom: 16px; }
    .confirmation-details {
      background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px;
      margin: 24px auto; max-width: 400px; text-align: left;
    }
    .confirmation-detail { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 0.95rem; color: #374151; }
    .confirmation-detail + .confirmation-detail { border-top: 1px solid #f0f0f0; }
    .confirmation-detail-label { font-size: 0.8rem; color: #9ca3af; min-width: 50px; }
    .confirmation-email { color: #6b7280; font-size: 0.9rem; margin-top: 20px; }

    /* Loading / spinner */
    .loading { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #eee; border-top-color: #6366f1;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #6b7280; font-size: 0.95rem; }

    /* Step content visibility */
    .step-content { display: none; }
    .step-content.active { display: block; }

    /* Responsive */
    @media (max-width: 600px) {
      .card { padding: 24px; margin-top: -20px; }
      .type-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .type-card { padding: 20px 12px; }
      .form-grid { grid-template-columns: 1fr; }
      .steps { gap: 4px; }
      .step-label { font-size: 0.6rem; }
      .step-num { width: 28px; height: 28px; font-size: 0.7rem; }
      .time-slot { min-width: 90px; padding: 10px 14px; font-size: 0.9rem; }
      .section-title { font-size: 1.25rem; }
    }
    @media (max-width: 400px) {
      .type-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="/images/logo.gif" alt="Homestead Cabinet Design" class="logo">
  </div>

  <div class="container">
    <div class="card">

      <!-- Loading state -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p class="loading-text">Loading appointment types...</p>
      </div>

      <!-- Main wizard content (hidden until loaded) -->
      <div id="wizard" style="display:none;">

        <!-- Step indicators -->
        <div class="steps" id="step-indicators">
          <div class="step active" data-step="1"><span class="step-num">1</span><span class="step-label">Type</span></div>
          <div class="step" data-step="2"><span class="step-num">2</span><span class="step-label">Date</span></div>
          <div class="step" data-step="3"><span class="step-num">3</span><span class="step-label">Time</span></div>
          <div class="step" data-step="4"><span class="step-num">4</span><span class="step-label">Details</span></div>
          <div class="step" data-step="5"><span class="step-num">5</span><span class="step-label">Done</span></div>
        </div>

        <!-- Step 1: Choose Type -->
        <div class="step-content active" id="step-1">
          <h2 class="section-title">What type of appointment?</h2>
          <div class="type-grid" id="type-grid"></div>
        </div>

        <!-- Step 2: Pick Date -->
        <div class="step-content" id="step-2">
          <button class="btn-back" onclick="goToStep(1)">&larr; Back</button>
          <h2 class="section-title">Choose a date</h2>
          <div id="calendar-container">
            <div class="calendar-nav">
              <button class="calendar-nav-btn" id="cal-prev" onclick="changeMonth(-1)">&lsaquo;</button>
              <span class="calendar-month" id="cal-month-label"></span>
              <button class="calendar-nav-btn" id="cal-next" onclick="changeMonth(1)">&rsaquo;</button>
            </div>
            <div class="calendar-weekdays">
              <div class="calendar-weekday">Sun</div>
              <div class="calendar-weekday">Mon</div>
              <div class="calendar-weekday">Tue</div>
              <div class="calendar-weekday">Wed</div>
              <div class="calendar-weekday">Thu</div>
              <div class="calendar-weekday">Fri</div>
              <div class="calendar-weekday">Sat</div>
            </div>
            <div class="calendar-days" id="cal-days"></div>
          </div>
          <div class="loading" id="calendar-loading" style="display:none;">
            <div class="spinner"></div>
            <p class="loading-text">Loading availability...</p>
          </div>
        </div>

        <!-- Step 3: Pick Time -->
        <div class="step-content" id="step-3">
          <button class="btn-back" onclick="goToStep(2)">&larr; Back</button>
          <h2 class="section-title">Pick a time</h2>
          <p class="section-subtitle" id="selected-date-label"></p>
          <div class="time-grid" id="time-grid"></div>
          <div class="no-slots" id="no-slots" style="display:none;">
            <p>No available times on this date. Please choose another date.</p>
            <button class="btn-back" onclick="goToStep(2)">&larr; Choose another date</button>
          </div>
        </div>

        <!-- Step 4: Enter Info -->
        <div class="step-content" id="step-4">
          <button class="btn-back" onclick="goToStep(3)">&larr; Back</button>
          <h2 class="section-title">Your information</h2>
          <div class="summary-line" id="booking-summary"></div>
          <form id="booking-form" onsubmit="submitBooking(event)">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">First Name <span class="required">*</span></label>
                <input type="text" class="form-input" id="inp-first" required placeholder="First name">
              </div>
              <div class="form-group">
                <label class="form-label">Last Name <span class="required">*</span></label>
                <input type="text" class="form-input" id="inp-last" required placeholder="Last name">
              </div>
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Email <span class="required">*</span></label>
                <input type="email" class="form-input" id="inp-email" required placeholder="you@example.com">
              </div>
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-input" id="inp-phone" placeholder="(555) 123-4567">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Notes</label>
              <textarea class="form-textarea" id="inp-notes" placeholder="Anything we should know?"></textarea>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Book Appointment</button>
          </form>
        </div>

        <!-- Step 5: Confirmation -->
        <div class="step-content" id="step-5">
          <div class="confirmation">
            <div class="confirmation-icon">&#10003;</div>
            <h2>Appointment Booked!</h2>
            <div class="confirmation-details" id="confirm-details"></div>
            <p class="confirmation-email" id="confirm-email"></p>
            <button class="btn-link" onclick="resetWizard()">Book Another</button>
            <button class="btn-link" onclick="window.close()" style="margin-top: 8px; color: #999;">Close Window</button>
          </div>
        </div>

      </div><!-- /wizard -->

    </div><!-- /card -->
  </div><!-- /container -->

  <script>
    // ========== State ==========
    let currentStep = 1;
    let types = [];
    let selectedType = null;
    let selectedDate = null;
    let selectedTime = null;
    let config = null;
    let blockedDates = [];
    let blockedTimes = [];
    let bookedSlots = [];
    let currentMonth = new Date();

    // ========== Helpers ==========
    function timeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTime(m) {
      return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }

    function formatTime(t) {
      const [h, m] = t.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hr = h % 12 || 12;
      return hr + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    function slotsOverlap(start1, dur1, start2, dur2, buffer) {
      const s1 = timeToMinutes(start1), e1 = s1 + dur1;
      const s2 = timeToMinutes(start2), e2 = s2 + dur2;
      return (s1 < e2 + buffer) && (s2 < e1 + buffer);
    }

    function monthKey(date) {
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
    }

    function dateKey(y, m, d) {
      return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }

    // Normalize config: convert old days/start_time/end_time to schedule format
    function normalizeConfig(cfg) {
      if (cfg.schedule) return cfg;
      const start = cfg.start_time || '09:00';
      const end = cfg.end_time || '17:00';
      const days = cfg.days || [1,2,3,4,5];
      const schedule = {};
      for (let d = 1; d <= 7; d++) {
        schedule[String(d)] = days.includes(d) ? [{ start, end }] : [];
      }
      cfg.schedule = schedule;
      return cfg;
    }

    // ========== Step Navigation ==========
    function goToStep(step) {
      currentStep = step;
      // Update step indicators
      document.querySelectorAll('.steps .step').forEach(el => {
        const s = parseInt(el.dataset.step);
        el.classList.remove('active', 'completed');
        if (s === currentStep) el.classList.add('active');
        else if (s < currentStep) el.classList.add('completed');
      });
      // Show/hide step content
      document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
      document.getElementById('step-' + step).classList.add('active');
      // Scroll to top of card
      document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ========== Step 1: Types ==========
    async function init() {
      try {
        const resp = await fetch('/api/schedule-availability');
        if (!resp.ok) throw new Error('Failed to load appointment types');
        const data = await resp.json();
        types = data.types || [];

        if (types.length === 0) {
          document.getElementById('loading').innerHTML = '<p style="color:#6b7280;">Online scheduling is not currently available.</p>';
          return;
        }

        renderTypes();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('wizard').style.display = 'block';
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = '<p style="color:#e53e3e;">Unable to load scheduling. Please try again later.</p>';
      }
    }

    function renderTypes() {
      const grid = document.getElementById('type-grid');
      grid.innerHTML = types.map(t => `
        <div class="type-card" data-id="${t.id}" onclick="selectType('${t.id}')">
          <div class="type-card-icon">${t.icon || '📅'}</div>
          <div class="type-card-name">${t.name}</div>
        </div>
      `).join('');
    }

    async function selectType(id) {
      selectedType = types.find(t => t.id === id);
      // Highlight selected card
      document.querySelectorAll('.type-card').forEach(el => el.classList.remove('selected'));
      document.querySelector(`.type-card[data-id="${id}"]`).classList.add('selected');

      // Reset downstream selections
      selectedDate = null;
      selectedTime = null;
      config = null;
      blockedDates = [];
      bookedSlots = [];
      currentMonth = new Date();

      // Move to step 2 and load availability
      goToStep(2);
      await loadMonthAvailability();
    }

    // ========== Step 2: Calendar ==========
    async function loadMonthAvailability() {
      const calContainer = document.getElementById('calendar-container');
      const calLoading = document.getElementById('calendar-loading');
      calContainer.style.display = 'none';
      calLoading.style.display = 'block';

      try {
        const mk = monthKey(currentMonth);
        const resp = await fetch(`/api/schedule-availability?type_id=${selectedType.id}&month=${mk}`);
        if (!resp.ok) throw new Error('Failed to load availability');
        const data = await resp.json();

        config = normalizeConfig(data.config);
        blockedDates = data.blocked_dates || [];
        blockedTimes = data.blocked_times || [];
        bookedSlots = data.booked_slots || [];

        calLoading.style.display = 'none';
        calContainer.style.display = 'block';
        renderCalendar();
      } catch (err) {
        console.error(err);
        calLoading.innerHTML = '<p style="color:#e53e3e;">Failed to load availability. Please try again.</p>';
      }
    }

    function isDayFullyBooked(dateStr) {
      if (!config) return false;
      const d = new Date(dateStr + 'T12:00:00');
      const jsDay = d.getDay();
      const isoDay = jsDay === 0 ? 7 : jsDay;
      const windows = config.schedule[String(isoDay)] || [];
      if (windows.length === 0) return true;

      for (const win of windows) {
        const startMin = timeToMinutes(win.start);
        const endMin = timeToMinutes(win.end);
        for (let minute = startMin; minute + config.slot_duration <= endMin; minute += config.slot_duration) {
          const timeStr = minutesToTime(minute);
          const apptDateTime = new Date(dateStr + 'T' + timeStr);
          if (apptDateTime - new Date() < config.lead_time_hours * 3600000) continue;
          const overlaps = bookedSlots.some(s => {
            if (s.date !== dateStr) return false;
            return slotsOverlap(timeStr, config.slot_duration, s.time, s.duration, config.buffer_minutes);
          });
          if (overlaps) continue;
          // Check blocked time ranges
          const slotS = timeToMinutes(timeStr);
          const slotE = slotS + config.slot_duration;
          const blockedTime = blockedTimes.some(bt => {
            if (bt.date !== dateStr) return false;
            return slotS < timeToMinutes(bt.end) && slotE > timeToMinutes(bt.start);
          });
          if (!blockedTime) return false;
        }
      }
      return true;
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay(); // 0=Sun
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Month label
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      document.getElementById('cal-month-label').textContent = monthNames[month] + ' ' + year;

      // Prev button: disable if this is the current month
      const nowMonth = new Date();
      document.getElementById('cal-prev').disabled =
        (year === nowMonth.getFullYear() && month === nowMonth.getMonth());

      // Max advance date
      const maxDate = new Date();
      maxDate.setDate(maxDate.getDate() + (config ? config.max_advance_days : 60));

      // Build day cells
      const daysContainer = document.getElementById('cal-days');
      let html = '';

      // Empty cells before first day
      for (let i = 0; i < firstDayOfMonth; i++) {
        html += '<div class="calendar-day empty"></div>';
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const ds = dateKey(year, month, d);
        const date = new Date(year, month, d);
        date.setHours(0, 0, 0, 0);
        const jsDay = date.getDay(); // 0=Sun
        const isoDay = jsDay === 0 ? 7 : jsDay; // 1=Mon...7=Sun

        let classes = 'calendar-day';
        let disabled = false;

        // Past date
        if (date < today) disabled = true;

        // Beyond max advance
        if (date > maxDate) disabled = true;

        // Wrong day of week (no windows = closed)
        if (config && (!config.schedule[String(isoDay)] || config.schedule[String(isoDay)].length === 0)) disabled = true;

        // Blocked date
        if (blockedDates.includes(ds)) disabled = true;

        // Lead time: if the entire day is within lead time, disable
        if (!disabled && config) {
          const endOfDay = new Date(date);
          endOfDay.setHours(23, 59, 59, 999);
          const hoursUntilEndOfDay = (endOfDay - new Date()) / 3600000;
          if (hoursUntilEndOfDay < config.lead_time_hours) {
            // More nuanced: check if at least one slot could be outside lead time
            // We handle this in isDayFullyBooked, so let's just check fully booked
          }
        }

        // Fully booked
        if (!disabled && isDayFullyBooked(ds)) disabled = true;

        if (disabled) classes += ' disabled';

        // Today marker
        if (date.getTime() === today.getTime()) classes += ' today';

        // Selected
        if (selectedDate === ds) classes += ' selected';

        if (disabled) {
          html += `<div class="${classes}">${d}</div>`;
        } else {
          html += `<div class="${classes}" onclick="selectDate('${ds}')">${d}</div>`;
        }
      }

      daysContainer.innerHTML = html;
    }

    function changeMonth(delta) {
      const newMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
      const now = new Date();
      // Don't go before current month
      if (newMonth.getFullYear() < now.getFullYear() ||
        (newMonth.getFullYear() === now.getFullYear() && newMonth.getMonth() < now.getMonth())) {
        return;
      }
      currentMonth = newMonth;
      loadMonthAvailability();
    }

    function selectDate(ds) {
      selectedDate = ds;
      selectedTime = null;
      renderCalendar(); // update selected highlight
      goToStep(3);
      renderTimeSlots();
    }

    // ========== Step 3: Time Slots ==========
    function renderTimeSlots() {
      document.getElementById('selected-date-label').textContent = formatDate(selectedDate);

      if (!config) {
        document.getElementById('time-grid').innerHTML = '';
        document.getElementById('no-slots').style.display = 'block';
        return;
      }

      // Get windows for the selected day
      const d = new Date(selectedDate + 'T12:00:00');
      const jsDay = d.getDay();
      const isoDay = jsDay === 0 ? 7 : jsDay;
      const windows = config.schedule[String(isoDay)] || [];
      const slots = [];

      for (const win of windows) {
        const startMin = timeToMinutes(win.start);
        const endMin = timeToMinutes(win.end);
        for (let minute = startMin; minute + config.slot_duration <= endMin; minute += config.slot_duration) {
          const timeStr = minutesToTime(minute);
          const apptDateTime = new Date(selectedDate + 'T' + timeStr);
          if (apptDateTime - new Date() < config.lead_time_hours * 3600000) continue;
          const overlaps = bookedSlots.some(s => {
            if (s.date !== selectedDate) return false;
            return slotsOverlap(timeStr, config.slot_duration, s.time, s.duration, config.buffer_minutes);
          });
          if (!overlaps) {
            // Check blocked time ranges for this date
            const slotStartMin = timeToMinutes(timeStr);
            const slotEndMin = slotStartMin + config.slot_duration;
            const isBlockedTime = blockedTimes.some(bt => {
              if (bt.date !== selectedDate) return false;
              const btStart = timeToMinutes(bt.start);
              const btEnd = timeToMinutes(bt.end);
              return slotStartMin < btEnd && slotEndMin > btStart;
            });
            if (!isBlockedTime) slots.push(timeStr);
          }
        }
      }
      // Sort chronologically (windows may not be ordered)
      slots.sort();

      const grid = document.getElementById('time-grid');
      const noSlots = document.getElementById('no-slots');

      if (slots.length === 0) {
        grid.innerHTML = '';
        grid.style.display = 'none';
        noSlots.style.display = 'block';
      } else {
        noSlots.style.display = 'none';
        grid.style.display = 'flex';
        grid.innerHTML = slots.map(t => `
          <button class="time-slot" type="button" onclick="selectTime('${t}')">${formatTime(t)}</button>
        `).join('');
      }
    }

    function selectTime(t) {
      selectedTime = t;
      // Highlight
      document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
      event.target.classList.add('selected');
      // Build summary and go to step 4
      renderSummary();
      goToStep(4);
    }

    // ========== Step 4: Info Form ==========
    function renderSummary() {
      const icon = selectedType.icon || '📅';
      const summary = document.getElementById('booking-summary');
      summary.innerHTML = `
        <span>${icon} ${selectedType.name}</span>
        <span class="sep">&middot;</span>
        <span>${formatDate(selectedDate)}</span>
        <span class="sep">&middot;</span>
        <span>${formatTime(selectedTime)}</span>
      `;
    }

    async function submitBooking(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Booking...';

      const payload = {
        type_id: selectedType.id,
        date: selectedDate,
        time: selectedTime,
        first_name: document.getElementById('inp-first').value.trim(),
        last_name: document.getElementById('inp-last').value.trim(),
        email: document.getElementById('inp-email').value.trim(),
        phone: document.getElementById('inp-phone').value.trim(),
        notes: document.getElementById('inp-notes').value.trim()
      };

      try {
        const resp = await fetch('/api/schedule-book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (resp.status === 409) {
          const err = await resp.json();
          alert(err.error || 'This time slot is no longer available. Please choose another time.');
          btn.disabled = false;
          btn.textContent = 'Book Appointment';
          // Re-fetch availability and go back to time selection
          await loadMonthAvailability();
          goToStep(3);
          renderTimeSlots();
          return;
        }

        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.error || 'Booking failed');
        }

        // Success - show confirmation
        renderConfirmation(payload.email);
        goToStep(5);

      } catch (err) {
        console.error(err);
        alert(err.message || 'An error occurred. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Book Appointment';
      }
    }

    // ========== Step 5: Confirmation ==========
    function renderConfirmation(email) {
      const icon = selectedType.icon || '📅';
      document.getElementById('confirm-details').innerHTML = `
        <div class="confirmation-detail">
          <span class="confirmation-detail-label">Type</span>
          <span>${icon} ${selectedType.name}</span>
        </div>
        <div class="confirmation-detail">
          <span class="confirmation-detail-label">Date</span>
          <span>${formatDate(selectedDate)}</span>
        </div>
        <div class="confirmation-detail">
          <span class="confirmation-detail-label">Time</span>
          <span>${formatTime(selectedTime)}</span>
        </div>
      `;
      document.getElementById('confirm-email').textContent =
        'A confirmation email has been sent to ' + email;
    }

    function resetWizard() {
      currentStep = 1;
      selectedType = null;
      selectedDate = null;
      selectedTime = null;
      config = null;
      blockedDates = [];
      blockedTimes = [];
      bookedSlots = [];
      currentMonth = new Date();

      // Reset form fields
      document.getElementById('booking-form').reset();
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('submit-btn').textContent = 'Book Appointment';

      // Reset type card selections
      document.querySelectorAll('.type-card').forEach(el => el.classList.remove('selected'));

      goToStep(1);
    }

    // ========== Init ==========
    init();
  </script>
</body>
</html>
