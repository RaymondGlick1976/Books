<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homestead Cabinet Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HCD Books">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      color: #1e293b;
    }
    
    .container {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 500px;
    }
    
    .logo {
      text-align: center;
      margin: 0 auto 1.5rem;
    }
    
    .logo img {
      max-width: 300px;
      height: auto;
    }
    
    h1 {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #38571a;
      margin-bottom: 0.5rem;
    }
    
    .tagline {
      color: #64748b;
      margin-bottom: 2.5rem;
    }
    
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .btn {
      display: block;
      padding: 1rem 2rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .btn-primary {
      background: #38571a;
      color: white;
    }
    
    .btn-primary:hover {
      background: #2a4213;
    }
    
    .btn-secondary {
      background: white;
      color: #38571a;
      border: 2px solid #e2e8f0;
    }
    
    .btn-secondary:hover {
      border-color: #38571a;
    }
    
    .footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }
    
    .footer a {
      color: #38571a;
      text-decoration: none;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img data-brand-logo src="" alt="Company Logo" style="max-width: 300px; height: auto; display:none;">
      <script>(function(){var u=localStorage.getItem('brand_logo_url');if(u){var i=document.querySelector('[data-brand-logo]');i.src=u;i.style.display='';}})()</script>
    </div>
    
    <p class="tagline">Quote & Invoice Portal</p>
    
    <div class="buttons">
      <a href="/portal/login.html" class="btn btn-primary">Customer Portal</a>
      <a href="/admin/index.html" class="btn btn-secondary">Admin Dashboard</a>
    </div>
    
    <div class="footer">
      <p>Western MA & Northern CT</p>
      <p><a href="mailto:raymond@homesteadcabinetdesign.com">raymond@homesteadcabinetdesign.com</a></p>
      <p><a href="https://homesteadcabinetdesign.com">homesteadcabinetdesign.com</a></p>
    </div>
  </div>
</body>
</html>
