<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body>
  <script>
    const user = JSON.parse(localStorage.getItem('app_user') || 'null');
    if (!user) {
      window.location.href = '/admin/login.html';
    } else if (!user.permissions?.can_view_pipeline) {
      window.location.href = '/admin/index.html';
    }
  </script>
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-logo">
        <img data-brand-logo src="" alt="Company Logo" style="height: 40px; filter: brightness(0) invert(1); display: none;">
      </div>
      <nav>
        <ul class="sidebar-nav">
          <li class="sidebar-nav-item"><a href="/admin/today.html" class="sidebar-nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Today</a></li>
          <li class="sidebar-nav-item"><a href="/admin/index.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a></li>
          <li class="sidebar-nav-item"><a href="/admin/pipeline.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Deals Pipeline</a></li>
          <li class="sidebar-nav-item"><a href="/admin/pipeline.html?view=calendar" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar</a></li>
          <li class="sidebar-nav-item"><a href="/admin/customers.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Customers</a></li>
          <li class="sidebar-nav-item"><a href="/admin/vendors.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Vendors</a></li>
          <li class="sidebar-nav-item"><a href="/admin/quotes.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>Quotes</a></li>
          <li class="sidebar-nav-item"><a href="/admin/invoices.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>Invoices</a></li>
          <li class="sidebar-nav-item"><a href="/admin/payments.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Payments</a></li>
          <li class="sidebar-nav-item"><a href="/admin/punch-list.html" class="sidebar-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Punch List</a></li>
        </ul>
      </nav>
    </aside>

    <main class="app-main">
      <header class="app-header">
        <h2>Today</h2>
        <div class="flex gap-md items-center">
          <label class="flex gap-sm items-center" style="font-size: 14px;">
            <input type="checkbox" id="show-done" onchange="renderTodos()"> Show done
          </label>
          <button class="btn btn-sm" onclick="loadAll()">Refresh</button>
        </div>
      </header>

      <div class="app-content">
        <!-- Add to-do -->
        <div class="card mb-xl">
          <div class="card-body">
            <form id="add-form" class="flex gap-md items-center" style="flex-wrap: wrap;" onsubmit="addTodo(event)">
              <input type="text" id="new-title" class="form-input" placeholder="Add a to-do, e.g. Call Joanne Dervito to schedule" style="flex: 1 1 320px;" required>
              <select id="new-bucket" class="form-select" style="max-width: 130px;">
                <option value="today">Today</option>
                <option value="week">This week</option>
                <option value="later">Later</option>
              </select>
              <select id="new-job" class="form-select" style="max-width: 240px;">
                <option value="">No job</option>
              </select>
              <input type="text" id="new-owner" class="form-input" list="owner-list" placeholder="Owner" style="max-width: 130px;">
              <input type="date" id="new-due" class="form-input" style="max-width: 160px;">
              <button type="submit" class="btn btn-primary">Add</button>
            </form>
            <datalist id="owner-list">
              <option value="Raymond"></option>
              <option value="Paige"></option>
            </datalist>
          </div>
        </div>

        <!-- Three buckets -->
        <div id="buckets" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start;">
          <div class="card"><div class="card-body"><h3 style="margin-bottom: 12px;">Today <span id="count-today" class="text-muted"></span></h3><div id="list-today"></div></div></div>
          <div class="card"><div class="card-body"><h3 style="margin-bottom: 12px;">This week <span id="count-week" class="text-muted"></span></h3><div id="list-week"></div></div></div>
          <div class="card"><div class="card-body"><h3 style="margin-bottom: 12px;">Later <span id="count-later" class="text-muted"></span></h3><div id="list-later"></div></div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    let todos = [];
    let jobs = [];
    const BUCKETS = ['today', 'week', 'later'];

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fmtDate(d) {
      if (!d) return '';
      const [y, m, day] = d.split('-');
      return new Date(Number(y), Number(m) - 1, Number(day)).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    async function loadAll() {
      try {
        const supabase = await app.waitForSupabase();
        const [t, j] = await Promise.all([
          supabase.from('todos')
            .select('*, jobs(name, customers(name))')
            .order('created_at', { ascending: true })
            .limit(500),
          supabase.from('jobs')
            .select('id, name, customers(name)')
            .order('name')
            .limit(500),
        ]);
        if (t.error) throw t.error;
        if (j.error) throw j.error;
        todos = t.data || [];
        jobs = j.data || [];
        renderJobOptions();
        renderTodos();
      } catch (err) {
        console.error(err);
        showToast('Failed to load to-dos', 'error');
      }
    }

    function renderJobOptions() {
      const sel = document.getElementById('new-job');
      const keep = sel.value;
      sel.innerHTML = '<option value="">No job</option>' + jobs.map(j => {
        const label = [j.name, j.customers?.name].filter(Boolean).join(' · ');
        return `<option value="${esc(j.id)}">${esc(label)}</option>`;
      }).join('');
      sel.value = keep;
    }

    function renderTodos() {
      const showDone = document.getElementById('show-done').checked;
      for (const b of BUCKETS) {
        const items = todos
          .filter(t => t.bucket === b && (showDone || !t.is_done))
          .sort((a, b2) => (a.is_done - b2.is_done) || (a.due_date || '9999').localeCompare(b2.due_date || '9999'));
        const open = todos.filter(t => t.bucket === b && !t.is_done).length;
        document.getElementById('count-' + (b === 'week' ? 'week' : b)).textContent = open ? `(${open})` : '';
        const list = document.getElementById('list-' + b);
        list.innerHTML = items.length ? items.map(renderItem).join('') :
          '<p style="color: var(--color-text-muted); font-size: 14px;">Nothing here.</p>';
      }
    }

    function renderItem(t) {
      const jobName = t.jobs ? [t.jobs.name, t.jobs.customers?.name].filter(Boolean).join(' · ') : '';
      const meta = [t.owner, t.due_date ? 'Due ' + fmtDate(t.due_date) : ''].filter(Boolean).join(' · ');
      const moveOpts = BUCKETS.filter(b => b !== t.bucket)
        .map(b => `<option value="${b}">${b === 'week' ? 'This week' : b[0].toUpperCase() + b.slice(1)}</option>`).join('');
      return `
        <div style="display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--color-border); ${t.is_done ? 'opacity: 0.55;' : ''}">
          <input type="checkbox" ${t.is_done ? 'checked' : ''} onchange="toggleDone('${t.id}', this.checked)" style="width: 18px; height: 18px; margin-top: 3px; cursor: pointer;">
          <div style="flex: 1; min-width: 0;">
            <div style="${t.is_done ? 'text-decoration: line-through;' : ''} white-space: pre-wrap;">${esc(t.title)}</div>
            ${jobName ? `<div style="font-size: 13px;"><a href="/admin/pipeline.html" style="color: var(--color-primary); text-decoration: none;">${esc(jobName)}</a></div>` : ''}
            ${meta ? `<div style="font-size: 12px; color: var(--color-text-muted);">${esc(meta)}</div>` : ''}
            ${t.notes ? `<div style="font-size: 13px; color: var(--color-text-muted); white-space: pre-wrap;">${esc(t.notes)}</div>` : ''}
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
            <select class="form-select" style="font-size: 12px; padding: 2px 6px;" onchange="moveTodo('${t.id}', this.value)">
              <option value="">Move…</option>${moveOpts}
            </select>
            <button class="btn btn-sm" style="color: var(--color-danger);" onclick="deleteTodo('${t.id}')">×</button>
          </div>
        </div>`;
    }

    async function addTodo(e) {
      e.preventDefault();
      const title = document.getElementById('new-title').value.trim();
      if (!title) return;
      const row = {
        title,
        bucket: document.getElementById('new-bucket').value,
        job_id: document.getElementById('new-job').value || null,
        owner: document.getElementById('new-owner').value.trim() || null,
        due_date: document.getElementById('new-due').value || null,
        source: 'manual',
      };
      try {
        const supabase = await app.waitForSupabase();
        const { data, error } = await supabase.from('todos').insert(row)
          .select('*, jobs(name, customers(name))').single();
        if (error) throw error;
        todos.push(data);
        document.getElementById('add-form').reset();
        renderTodos();
      } catch (err) {
        console.error(err);
        showToast('Failed to add to-do', 'error');
      }
    }

    async function updateTodo(id, changes) {
      try {
        const supabase = await app.waitForSupabase();
        const { error } = await supabase.from('todos')
          .update({ ...changes, updated_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
        const t = todos.find(x => x.id === id);
        if (t) Object.assign(t, changes);
        renderTodos();
      } catch (err) {
        console.error(err);
        showToast('Failed to update to-do', 'error');
        await loadAll();
      }
    }

    function toggleDone(id, checked) {
      updateTodo(id, { is_done: checked, done_at: checked ? new Date().toISOString() : null });
    }

    function moveTodo(id, bucket) {
      if (bucket) updateTodo(id, { bucket });
    }

    async function deleteTodo(id) {
      if (!confirm('Delete this to-do?')) return;
      try {
        const supabase = await app.waitForSupabase();
        const { error } = await supabase.from('todos').delete().eq('id', id);
        if (error) throw error;
        todos = todos.filter(t => t.id !== id);
        renderTodos();
      } catch (err) {
        console.error(err);
        showToast('Failed to delete to-do', 'error');
      }
    }

    loadAll();
  </script>
</body>
</html>
