    <main class="app-main">

        <h2>Invoices</h2>
      </header>
      
      <div class="app-content">
        <!-- Filters -->
        <div class="card mb-xl">
          <div class="card-body">
            <div class="flex gap-md items-center">
              <input type="text" id="search-input" class="form-input" placeholder="Search invoices..." style="max-width: 300px;">
              <select id="status-filter" class="form-select" style="max-width: 150px;">
                <option value="">All Status</option>
                <option value="draft">Draft</option>
                <option value="sent">Sent</option>
                <option value="viewed">Viewed</option>
                <option value="partial">Partial</option>
                <option value="paid">Paid</option>

              </select>
              <label class="form-check" style="margin-left: auto;">

                <span class="form-check-label">Hide archived</span>

        <!-- Invoices Table -->
        <div class="card">
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>Invoice #</th>

                  <th>Total</th>

                  <th>Due</th>

              </thead>
              <tbody id="invoices-tbody">

                  <td colspan="9" style="text-align: center; padding: 40px;">

  <script src="/js/utils.js"></script>
  <script>
    
    let invoices = [];
    
    async function loadInvoices() {
      try {
        const supabase = await app.waitForSupabase();
        
        const { data, error } = await supabase
          .from('invoices')
          .select('*, customers(name, email)')
          .order('created_at', { ascending: false });
        
        if (error) throw error;
        invoices = data || [];
        renderInvoices(invoices);
      } catch (err) {
        console.error('Load error:', err);
        showToast('Failed to load invoices', 'error');
      }
    }
    
    function renderInvoices(data) {
      const tbody = $('#invoices-tbody');
      clearElement(tbody);
      
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted p-xl">No invoices found</td></tr>';
        return;
      }
      
      data.forEach(invoice => {
        const row = createElement('tr');
        const qbIcon = invoice.qb_invoice_id ? `<span title="Synced to QuickBooks" style="color: var(--color-success); margin-right: 4px;">✓QB</span>` : '';
        row.innerHTML = `
          <td><strong>${invoice.invoice_number}</strong></td>
          <td>
            <div>${invoice.customers?.name || '—'}</div>
            <div class="text-sm text-muted">${invoice.customers?.email || ''}</div>
          </td>
          <td>${invoice.title}</td>
          <td>${formatCurrency(invoice.total)}</td>
          <td>${formatCurrency(invoice.amount_paid)}</td>
          <td class="${invoice.amount_due > 0 ? 'text-danger font-bold' : ''}">${formatCurrency(invoice.amount_due)}</td>
          <td><span class="badge badge-${invoice.status}">${invoice.status}</span> ${qbIcon}</td>
          <td>${invoice.due_date ? formatDate(invoice.due_date) : '—'}</td>
          <td class="table-actions">
            <button class="btn btn-ghost btn-sm" onclick="viewInvoice('${invoice.id}')">View</button>
            <a class="btn btn-ghost btn-sm" href="/admin/invoice-editor.html?id=${invoice.id}">Edit</a>
            <button class="btn btn-ghost btn-sm" onclick="printInvoiceById('${invoice.id}')" title="Print">🖨️</button>
            ${invoice.status !== 'paid' && invoice.status !== 'cancelled' && invoice.status !== 'archived' ? `<button class="btn btn-ghost btn-sm" onclick="sendInvoice('${invoice.id}')">${invoice.sent_at ? 'Resend' : 'Send'}</button>` : ''}
            ${invoice.amount_due > 0 ? `<button class="btn btn-ghost btn-sm" onclick="recordPayment('${invoice.id}')">Record Payment</button>` : ''}
            ${!invoice.qb_invoice_id
              ? `<button class="btn btn-ghost btn-sm" onclick="syncInvoiceToQB('${invoice.id}').then(loadInvoices)" title="Sync to QuickBooks">QB</button>`
              : `<button class="btn btn-ghost btn-sm" onclick="syncInvoiceToQB('${invoice.id}').then(loadInvoices)" title="Re-sync payments to QuickBooks" style="color: var(--color-success);">✓QB</button>`}
            ${invoice.status === 'archived' 
              ? `<button class="btn btn-ghost btn-sm" onclick="unarchiveInvoice('${invoice.id}')" title="Unarchive">📤</button>`
              : `<button class="btn btn-ghost btn-sm" onclick="archiveInvoice('${invoice.id}')" title="Archive">📥</button>`}
            <button class="btn btn-ghost btn-sm text-danger" onclick="deleteInvoice('${invoice.id}')" title="Delete">🗑️</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }
    
    // Search & Filter
    const searchInput = $('#search-input');
    const statusFilter = $('#status-filter');
    const hideArchivedCheckbox = $('#hide-archived');
    
    function applyFilters() {
      const query = searchInput.value.toLowerCase();
      const status = statusFilter.value;
      const hideArchived = hideArchivedCheckbox.checked;
      
      let filtered = invoices;
      
      // Hide archived unless specifically filtering for them
      if (hideArchived && status !== 'archived') {
        filtered = filtered.filter(inv => inv.status !== 'archived');
      }
      
      if (query) {
        filtered = filtered.filter(inv => 
          inv.invoice_number.toLowerCase().includes(query) ||
          inv.title.toLowerCase().includes(query) ||
          inv.customers?.name?.toLowerCase().includes(query) ||
          inv.customers?.email?.toLowerCase().includes(query)
        );
      }
      
      if (status) {
        filtered = filtered.filter(inv => inv.status === status);
      }
      
      renderInvoices(filtered);
    }
    
    searchInput.addEventListener('input', debounce(applyFilters, 300));
    statusFilter.addEventListener('change', applyFilters);
    hideArchivedCheckbox.addEventListener('change', applyFilters);
    
    window.viewInvoice = async (id) => {
      const invoice = invoices.find(i => i.id === id);
      if (!invoice) return;
      
      // Load line items
      const supabase = await app.waitForSupabase();
      const { data: lineItems } = await supabase
        .from('invoice_line_items')
        .select('*')
        .eq('invoice_id', id)
        .order('sort_order');
      
      const { data: payments } = await supabase
        .from('payments')
        .select('*')
        .eq('invoice_id', id)
        .eq('status', 'succeeded')
        .order('payment_date', { ascending: false });
      
      let itemsHtml = '';
      if (lineItems && lineItems.length > 0) {
        itemsHtml = `
          <table class="table" style="margin-bottom: var(--space-lg);">
            <thead>
              <tr>
                <th>Description</th>
                <th style="text-align: right;">Qty</th>
                <th style="text-align: right;">Price</th>
                <th style="text-align: right;">Total</th>
              </tr>
            </thead>
            <tbody>
              ${lineItems.map(item => {
                const attrs = (item.attribute_selections || []).filter(s => s.is_public && s.option_name);
                const attrsHtml = attrs.map(s => `<div class="text-sm text-muted" style="margin-top:2px;">${s.attribute_name}: ${s.option_name}</div>`).join('');
                return `
                <tr>
                  <td>
                    <div>${item.description}</div>
                    ${item.details ? `<div class="text-sm text-muted" style="white-space: pre-wrap;">${item.details}</div>` : ''}
                    ${attrsHtml}
                  </td>
                  <td style="text-align: right;">${item.quantity}</td>
                  <td style="text-align: right;">${formatCurrency(item.unit_price)}</td>
                  <td style="text-align: right;">${formatCurrency(item.line_total)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        `;
      }
      
      let paymentsHtml = '';
      if (payments && payments.length > 0) {
        paymentsHtml = `
          <div style="margin-top: var(--space-lg); padding-top: var(--space-lg); border-top: 1px solid var(--color-border);">
            <h4 style="margin-bottom: var(--space-sm);">Payment History</h4>
            ${payments.map(p => `
              <div class="flex justify-between items-center" style="padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-border-light);">
                <div>
                  <div>${formatCurrency(p.amount)}</div>
                  <div class="text-sm text-muted">${formatDate(p.payment_date)} • ${p.payment_method || 'Card'}${p.reference_number ? ' • Ref: ' + p.reference_number : ''}${p.notes ? ' • ' + p.notes : ''}</div>
                </div>
                <div style="display:flex;gap:var(--space-xs);align-items:center;">
                  <span class="badge badge-paid">Paid</span>
                  <button class="btn btn-ghost btn-sm" onclick="editPayment('${p.id}','${id}')" title="Edit payment" style="padding:2px 6px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  </button>
                  <button class="btn btn-ghost btn-sm" onclick="deletePayment('${p.id}','${id}')" title="Delete payment" style="padding:2px 6px;color:var(--color-danger);">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      
      // Load company info for header
      const { data: companySetting } = await supabase.from('settings').select('value').eq('key', 'company').single();
      const company = companySetting?.value || {};

      const statusColors = { draft: '#6b7280', sent: '#3b82f6', viewed: '#8b5cf6', partial: '#f59e0b', paid: '#10b981', overdue: '#ef4444', archived: '#9ca3af' };
      const statusColor = statusColors[invoice.status] || '#6b7280';

      const content = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--space-xl);padding-bottom:var(--space-lg);border-bottom:2px solid var(--color-primary);">
          <div style="display:flex;align-items:center;gap:var(--space-md);">
            <img src="/images/logo.gif" alt="${company.name || 'Company'}" style="height:60px;width:auto;" onerror="this.style.display='none'">
            <div>
              <div style="font-weight:700;font-size:1.1rem;">${company.name || 'Homestead Cabinet Design'}</div>
              ${company.phone ? `<div class="text-sm text-muted">${company.phone}</div>` : ''}
              ${company.email ? `<div class="text-sm text-muted">${company.email}</div>` : ''}
              ${company.address ? `<div class="text-sm text-muted">${company.address}</div>` : ''}
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:1.5rem;font-weight:700;color:var(--color-text);">INVOICE</div>
            <div style="font-size:1.1rem;font-weight:600;color:var(--color-primary);margin-top:2px;">${invoice.invoice_number}</div>
            <div style="margin-top:var(--space-sm);">
              <span style="display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:600;color:white;background:${statusColor};text-transform:uppercase;">${invoice.status}</span>
            </div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);margin-bottom:var(--space-xl);padding:var(--space-md);background:var(--color-bg-soft);border-radius:var(--radius-md);">
          <div>
            <div class="text-sm text-muted" style="font-weight:600;text-transform:uppercase;font-size:0.7rem;letter-spacing:0.03em;">Bill To</div>
            <div style="font-weight:600;margin-top:4px;">${invoice.customers?.name || '—'}</div>
            ${invoice.customers?.email ? `<div class="text-sm">${invoice.customers.email}</div>` : ''}
          </div>
          <div style="text-align:right;">
            <div style="margin-bottom:var(--space-sm);">
              <div class="text-sm text-muted" style="font-weight:600;text-transform:uppercase;font-size:0.7rem;letter-spacing:0.03em;">Invoice Date</div>
              <div style="font-weight:500;">${formatDate(invoice.created_at)}</div>
            </div>
            <div>
              <div class="text-sm text-muted" style="font-weight:600;text-transform:uppercase;font-size:0.7rem;letter-spacing:0.03em;">Due Date</div>
              <div style="font-weight:500;">${invoice.due_date ? formatDate(invoice.due_date) : '—'}</div>
            </div>
          </div>
        </div>

        <div style="font-weight:600;font-size:0.9rem;margin-bottom:var(--space-sm);">${invoice.title}</div>

        ${itemsHtml}

        <div style="display:flex;justify-content:flex-end;">
          <div style="width:280px;background:var(--color-bg-soft);padding:var(--space-md);border-radius:var(--radius-md);">
            <div class="flex justify-between mb-sm">
              <span>Subtotal</span>
              <span>${formatCurrency(invoice.subtotal)}</span>
            </div>
            ${invoice.tax_amount > 0 ? `
              <div class="flex justify-between mb-sm">
                <span>Tax (${(invoice.tax_rate * 100).toFixed(2)}%)</span>
                <span>${formatCurrency(invoice.tax_amount)}</span>
              </div>
            ` : ''}
            <div class="flex justify-between font-bold" style="padding-top:var(--space-sm);border-top:1px solid var(--color-border);">
              <span>Total</span>
              <span>${formatCurrency(invoice.total)}</span>
            </div>
            <div class="flex justify-between mt-sm" style="color:var(--color-success);">
              <span>Paid</span>
              <span>${formatCurrency(invoice.amount_paid)}</span>
            </div>
            <div class="flex justify-between mt-sm font-bold" style="padding-top:var(--space-sm);border-top:1px solid var(--color-border);font-size:1.1rem;color:${invoice.amount_due > 0 ? 'var(--color-danger)' : 'var(--color-success)'};">
              <span>Balance Due</span>
              <span>${formatCurrency(invoice.amount_due)}</span>
            </div>
          </div>
        </div>

        ${paymentsHtml}

        ${invoice.qb_invoice_id ? `
          <div style="margin-top:var(--space-lg);padding:var(--space-sm);background:var(--color-success-bg);border-radius:var(--radius-sm);display:flex;align-items:center;gap:var(--space-sm);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2">

    async function savePayment(invoiceId, formData) {
      try {
        const supabase = await app.waitForSupabase();
        const invoice = invoices.find(i => i.id === invoiceId);
        
        const amount = parseFloat(formData.get('amount'));
        
        // Insert payment record
        const { error: paymentError } = await supabase
          .from('payments')
          .insert({
            invoice_id: invoiceId,
            customer_id: invoice.customer_id,
            amount: amount,
            payment_method: formData.get('payment_method'),
            reference_number: formData.get('reference') || null,
            payment_date: formData.get('payment_date'),
            notes: formData.get('notes') || null,
            status: 'succeeded'
          });
        
        if (paymentError) throw paymentError;
        
        // Update invoice amounts
        const newAmountPaid = parseFloat(invoice.amount_paid || 0) + amount;
        const newAmountDue = parseFloat(invoice.total) - newAmountPaid;
        const newStatus = newAmountDue <= 0 ? 'paid' : 'partial';
        
        const { error: invoiceError } = await supabase
          .from('invoices')
          .update({
            amount_paid: newAmountPaid,
            amount_due: Math.max(0, newAmountDue),
            status: newStatus
          })
          .eq('id', invoiceId);
        
        if (invoiceError) throw invoiceError;
        
        showToast('Payment recorded successfully!', 'success');
        loadInvoices();
      } catch (err) {
        console.error('Payment error:', err);
        showToast('Failed to record payment: ' + err.message, 'error');
      }
    }

    window.deletePayment = async (paymentId, invoiceId) => {

      try {
        const supabase = await app.waitForSupabase();
        const { data: payment } = await supabase.from('payments').select('amount').eq('id', paymentId).single();
        if (!payment) { showToast('Payment not found', 'error'); return; }

        await supabase.from('payments').delete().eq('id', paymentId);

        // Recalculate invoice totals
        const invoice = invoices.find(i => i.id === invoiceId);
        const newPaid = Math.max(0, parseFloat(invoice.amount_paid || 0) - parseFloat(payment.amount));
        const newDue = parseFloat(invoice.total) - newPaid;
        const newStatus = newDue <= 0 ? 'paid' : newPaid > 0 ? 'partial' : 'draft';
        await supabase.from('invoices').update({
          amount_paid: newPaid,
          amount_due: Math.max(0, newDue),
          status: newStatus
        }).eq('id', invoiceId);

        showToast('Payment deleted', 'success');
        // Close view modal and refresh
        document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
        loadInvoices();
      } catch (err) {
        console.error(err);
        showToast('Failed to delete payment: ' + err.message, 'error');
      }

        return false;

        if (!invoice) return;
        const { data: lineItems } = await supabase.from('invoice_line_items').select('*').eq('invoice_id', id).order('sort_order');
        const { data: payments } = await supabase.from('payments').select('*').eq('invoice_id', id).eq('status', 'succeeded').order('payment_date');
        const { data: companySetting } = await supabase.from('settings').select('value').eq('key', 'company').single();
        const company = companySetting?.value || {};
        printInvoice(invoice, lineItems || [], payments || [], company);
      } catch (err) {
        showToast('Failed to load invoice for print', 'error');
      }
    };

    window.archiveInvoice = async (id) => {
      if (!confirm('Archive this invoice? It will be hidden from the default view.')) return;
      
      try {
        const supabase = await app.waitForSupabase();
        await supabase.from('invoices').update({ status: 'archived' }).eq('id', id);
        showToast('Invoice archived', 'success');
        loadInvoices();
      } catch (err) {
        showToast('Failed to archive: ' + err.message, 'error');
      }
    };
    
    window.unarchiveInvoice = async (id) => {
      try {
        const supabase = await app.waitForSupabase();
        await supabase.from('invoices').update({ status: 'draft' }).eq('id', id);
        showToast('Invoice unarchived', 'success');
        loadInvoices();
      } catch (err) {
        showToast('Failed to unarchive: ' + err.message, 'error');
      }
    };
    
    window.deleteInvoice = async (id) => {
      const invoice = invoices.find(i => i.id === id);
      if (!confirm(`Permanently delete invoice ${invoice?.invoice_number || ''}? This cannot be undone.`)) return;
      
      try {
        const supabase = await app.waitForSupabase();
        const { error } = await supabase.from('invoices').delete().eq('id', id);
        if (error) throw error;
        showToast('Invoice deleted', 'success');
        loadInvoices();
      } catch (err) {
        showToast('Failed to delete: ' + err.message, 'error');
      }
    };
    
    // Initialize
    loadInvoices().then(() => {
      const params = new URLSearchParams(window.location.search);
      const openId = params.get('id');
      if (openId) viewInvoice(openId);
    });
  </script>
</body>
</html>
