<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Worksheet | Homestead Cabinet Design</title>
  <style>
    :root { --accent: #38571a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 12px;
      color: #1a1a1a;
      background: #e9ecef;
    }

    /* ── SCREEN TOOLBAR (hidden on print) ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #d0d0d0;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .toolbar .spacer { flex: 1; }
    .toolbar a.back { color: #555; text-decoration: none; font-size: 13px; }
    .toolbar a.back:hover { color: var(--accent); }
    .toolbar .hint { font-size: 12px; color: #888; }
    .btn-print {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-print:hover { filter: brightness(0.92); }

    /* ── PAGE ── */
    .page {
      width: 8.5in;
      min-height: 11in;
      margin: 20px auto;
      padding: 0.4in 0.5in;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }

    /* ── LETTERHEAD ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 3px solid var(--accent);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left img { max-height: 52px; max-width: 150px; }
    .header-left h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.3px;
      line-height: 1.1;
    }
    .header-left .tagline { font-size: 11px; color: #666; margin-top: 3px; font-style: italic; }
    .header-right { text-align: right; max-width: 3.4in; }
    .header-right .doc-title {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #333;
    }
    .header-right .product-name { font-size: 15px; font-weight: 700; color: var(--accent); margin-top: 4px; }
    .header-right .product-desc { font-size: 10.5px; color: #777; margin-top: 2px; line-height: 1.35; }

    /* ── META FIELDS ── */
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 22px;
      margin-bottom: 16px;
      padding: 11px 14px;
      border: 1px solid #d5d5d5;
      border-radius: 5px;
      background: #fafafa;
    }
    .meta-field { display: flex; align-items: center; gap: 8px; }
    .meta-field label {
      font-size: 9.5px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
      min-width: 82px;
    }
    .meta-field input {
      flex: 1;
      border: none;
      border-bottom: 1px solid #bbb;
      background: transparent;
      font-size: 12px;
      font-family: inherit;
      color: #1a1a1a;
      padding: 3px 2px;
    }
    .meta-field input:focus { outline: none; border-bottom-color: var(--accent); }

    /* ── TABLE ── */
    table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
    thead th {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: left;
      padding: 7px 10px;
    }
    thead th.num { text-align: right; }
    thead th.qty { text-align: center; width: 74px; }
    thead th.amt { text-align: right; width: 100px; }
    tbody td {
      padding: 7px 10px;
      border-bottom: 1px solid #e2e2e2;
      font-size: 12px;
      vertical-align: middle;
    }
    tbody tr:nth-child(even) { background: #f7f8f6; }
    td.attr-name { font-weight: 600; }
    td.unit-price { text-align: right; white-space: nowrap; }
    td.unit-price .unit-label { color: #888; font-size: 10px; font-weight: 400; }
    td.qty { text-align: center; }
    td.qty input {
      width: 58px;
      text-align: center;
      border: 1px solid #cfcfcf;
      border-radius: 4px;
      padding: 4px 3px;
      font-size: 12px;
      font-family: inherit;
    }
    td.qty input:focus { outline: none; border-color: var(--accent); }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.empty-row { color: #999; font-style: italic; text-align: center; padding: 18px; }

    /* ── TOTALS ── */
    .totals {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .totals-box { width: 3in; }
    .totals-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
      font-size: 12.5px;
    }
    .totals-row.subtotal { border-bottom: 1px solid #e2e2e2; }
    .totals-row.tax { border-bottom: 1px solid #e2e2e2; }
    .totals-row label { color: #555; font-weight: 600; }
    .totals-row .val { font-variant-numeric: tabular-nums; }
    .totals-row.tax .tax-input-wrap { display: flex; align-items: center; gap: 2px; }
    .totals-row.tax input {
      width: 84px;
      text-align: right;
      border: 1px solid #cfcfcf;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      font-family: inherit;
    }
    .totals-row.tax input:focus { outline: none; border-color: var(--accent); }
    .totals-row.grand {
      margin-top: 4px;
      padding-top: 9px;
      border-top: 2px solid var(--accent);
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: 34px;
      padding-top: 10px;
      border-top: 1px solid #d5d5d5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #888;
    }
    .footer .biz { font-weight: 700; color: #555; }

    .loading { text-align: center; padding: 80px 20px; color: #888; font-size: 14px; }

    /* ── PRINT ── */
    @page { size: letter portrait; margin: 0.4in; }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .page {
        width: auto;
        min-height: 0;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
      td.qty input, .totals-row.tax input, .meta-field input {
        border: none;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      td.qty input { border-bottom: 1px solid #ccc; }
      thead th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tbody tr:nth-child(even) { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <script>
    // Fast auth guard (utils.js also enforces this, but redirect early)
    if (!JSON.parse(localStorage.getItem('app_user') || 'null')) {
      window.location.href = '/admin/login.html';
    }
  </script>

  <div class="toolbar no-print">
    <button class="btn-print" onclick="window.print()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      Print
    </button>
    <span class="hint">Type quantities to auto-calculate line amounts and totals.</span>
    <span class="spacer"></span>
    <a class="back" href="/admin/pricing-attributes.html">&larr; Back to Pricing Attributes</a>
  </div>

  <div id="worksheet" class="page">
    <div class="loading">Loading worksheet&hellip;</div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    const DEFAULT_PRICING_TYPES = [
      { code: 'sqft', name: 'Square Feet', label: 'per Sq. Ft.' },
      { code: 'linft', name: 'Linear Feet', label: 'per Lin. Ft.' },
      { code: 'each', name: 'Each', label: 'Each' },
      { code: 'percentage', name: 'Percentage', label: '%' }
    ];

    let pricingTypes = [];

    function getPricingTypeLabel(code) {
      const pt = pricingTypes.find(p => p.code === code);
      return pt ? pt.label : (code || '');
    }

    function money(n) {
      return '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function esc(value) {
      const div = document.createElement('div');
      div.textContent = value == null ? '' : String(value);
      return div.innerHTML;
    }

    // Unit price display: percentage rows show "40%", others "$X.XX <label>"
    function unitPriceCell(price, type) {
      if (type === 'percentage') return `${price}%`;
      const label = getPricingTypeLabel(type);
      const labelHtml = (label && label !== 'Each') ? ` <span class="unit-label">${esc(label)}</span>` : '';
      return `${money(price)}${labelHtml}`;
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('worksheet').innerHTML =
          '<div class="loading">No product selected. Open this page from a product on the Pricing Attributes screen.</div>';
        return;
      }

      let supabase;
      try {
        supabase = await app.waitForSupabase();
      } catch (err) {
        document.getElementById('worksheet').innerHTML =
          '<div class="loading">Could not connect. Please try again.</div>';
        return;
      }

      // Load pricing types (fall back to defaults if table missing)
      try {
        const { data } = await supabase.from('pricing_types').select('*').order('sort_order, name');
        pricingTypes = data && data.length ? data : DEFAULT_PRICING_TYPES;
      } catch { pricingTypes = DEFAULT_PRICING_TYPES; }

      // Load the product (attribute) + its options, plus company/branding settings
      const [attrRes, settingsRes] = await Promise.all([
        supabase.from('pricing_attributes').select('*, options:pricing_attribute_options(*)').eq('id', id).single(),
        supabase.from('settings').select('key, value').in('key', ['company', 'branding'])
      ]);

      if (attrRes.error || !attrRes.data) {
        document.getElementById('worksheet').innerHTML =
          '<div class="loading">Product not found.</div>';
        return;
      }

      const attr = attrRes.data;
      attr.options = (attr.options || []).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

      const settings = {};
      (settingsRes.data || []).forEach(s => { settings[s.key] = s.value || {}; });
      const company = settings.company || {};
      const branding = settings.branding || {};

      render(attr, company, branding);
    }

    function render(attr, company, branding) {
      const bizName = company.name || 'Homestead Cabinet Design';
      const tagline = branding.tagline || '';
      const logoUrl = branding.logo_url || '';
      if (branding.color) document.documentElement.style.setProperty('--accent', branding.color);

      const user = (typeof getCurrentUser === 'function' && getCurrentUser()) || null;
      const preparedBy = user?.name || '';
      const today = new Date().toISOString().slice(0, 10);

      const rowsHtml = attr.options.length
        ? attr.options.map(opt => {
            const price = parseFloat(opt.unit_price ?? opt.flat_adjustment ?? 0) || 0;
            const type = opt.pricing_type || 'each';
            return `
              <tr>
                <td class="attr-name">${esc(opt.name)}</td>
                <td class="unit-price" data-price="${price}">${unitPriceCell(price, type)}</td>
                <td class="qty"><input type="number" min="0" step="any" inputmode="decimal" oninput="recalcRow(this)"></td>
                <td class="amount">${money(0)}</td>
              </tr>`;
          }).join('')
        : `<tr><td class="empty-row" colspan="4">This product has no options yet.</td></tr>`;

      document.getElementById('worksheet').innerHTML = `
        <div class="header">
          <div class="header-left">
            ${logoUrl ? `<img src="${esc(logoUrl)}" alt="${esc(bizName)}">` : ''}
            <div>
              <h1>${esc(bizName)}</h1>
              ${tagline ? `<div class="tagline">${esc(tagline)}</div>` : ''}
            </div>
          </div>
          <div class="header-right">
            <div class="doc-title">Price Worksheet</div>
            <div class="product-name">${esc(attr.name)}</div>
            ${attr.description ? `<div class="product-desc">${esc(attr.description)}</div>` : ''}
          </div>
        </div>

        <div class="meta-grid">
          <div class="meta-field"><label>Customer Name</label><input type="text"></div>
          <div class="meta-field"><label>Job / Quote #</label><input type="text"></div>
          <div class="meta-field"><label>Date</label><input type="date" value="${today}"></div>
          <div class="meta-field"><label>Prepared By</label><input type="text" value="${esc(preparedBy)}"></div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Attribute</th>
              <th class="num">Unit Price</th>
              <th class="qty">Qty</th>
              <th class="amt">Amount</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>

        <div class="totals">
          <div class="totals-box">
            <div class="totals-row subtotal">
              <label>Subtotal</label>
              <span class="val" id="subtotal">${money(0)}</span>
            </div>
            <div class="totals-row tax">
              <label>Tax</label>
              <span class="tax-input-wrap">$<input type="number" min="0" step="any" inputmode="decimal" id="tax-input" oninput="recalcTotals()" placeholder="0.00"></span>
            </div>
            <div class="totals-row grand">
              <label>Total</label>
              <span class="val" id="grand-total">${money(0)}</span>
            </div>
          </div>
        </div>

        <div class="footer">
          <span class="biz">${esc(bizName)}</span>
          <span>Prices subject to change without notice.</span>
        </div>
      `;
    }

    // Recalculate a single row's amount (unit price × qty), then update totals.
    function recalcRow(input) {
      const row = input.closest('tr');
      const price = parseFloat(row.querySelector('.unit-price').dataset.price) || 0;
      const qty = parseFloat(input.value) || 0;
      row.querySelector('.amount').textContent = money(price * qty);
      recalcTotals();
    }

    // Sum all row amounts into subtotal, add tax, produce total.
    function recalcTotals() {
      let subtotal = 0;
      document.querySelectorAll('.qty input').forEach(input => {
        const row = input.closest('tr');
        const price = parseFloat(row.querySelector('.unit-price').dataset.price) || 0;
        const qty = parseFloat(input.value) || 0;
        subtotal += price * qty;
      });
      const tax = parseFloat(document.getElementById('tax-input').value) || 0;
      document.getElementById('subtotal').textContent = money(subtotal);
      document.getElementById('grand-total').textContent = money(subtotal + tax);
    }

    init();
  </script>
</body>
</html>
